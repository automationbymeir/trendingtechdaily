name: Deploy Firebase Functions (manual, targeted)

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'firebase --only target, e.g. functions:serveSitemap or functions:handleArticleRouting,functions:handleHebrewRouting'
        required: true
      dry_run_note:
        description: 'Free-text note for the run log (reason for deploy)'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Deploy targeted functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/.gcp-sa.json
        run: |
          set -e
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRENDINGTECH_DAILY }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          echo "Deploy note: ${{ github.event.inputs.dry_run_note }}"
          firebase deploy --project trendingtech-daily --non-interactive --only "${{ github.event.inputs.targets }}"
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
