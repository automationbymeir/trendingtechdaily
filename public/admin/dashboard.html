<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendingTech Daily - Admin Dashboard</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/admin/css/admin.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar" id="admin-sidebar-panel">
                <div class="d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-center mb-4 px-2">
                        <h4 class="text-white mb-0" style="font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.05em;">ADMIN PANEL</h4>
                    </div>
                    <div id="admin-sidebar">
                        <p class="text-center text-white py-3">Loading menu...</p>
                    </div>
                </div>
            </div>

            <div class="col main-content">
                <header class="admin-header d-flex justify-content-between align-items-center p-3 mb-3 border-bottom" style="background:#fff;">
                    <div class="d-flex align-items-center gap-2">
                        <h2 class="mb-0 fs-4 fw-bold">TrendingTech Daily Admin</h2>
                    </div>
                    <div class="user-controls d-flex align-items-center">
                        <span id="user-email" class="me-3 badge bg-light text-dark border py-2 px-3"></span>
                        <button id="logout-btn" class="btn btn-sm btn-outline-danger">Logout</button>
                    </div>
                </header>

                <div id="content-area" class="p-3">
                    <div class="section-container">
                        <h3>Welcome to the Admin Dashboard</h3>
                        <p>Select a section from the sidebar to get started.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAMMvOPS6fczzI_2CTOcc_NlGGFO4qDydg",
            authDomain: "trendingtech-daily.firebaseapp.com",
            projectId: "trendingtech-daily",
            storageBucket: "trendingtech-daily.firebasestorage.app",
            messagingSenderId: "343812872871",
            appId: "1:343812872871:web:5bd68bd7d6140d83551982"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // Global Firebase service instances
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage();
        const functions = firebase.functions();
    </script>

    <!-- Admin Component Scripts -->
    <script src="/admin/components/sections.js"></script>
    <script src="/admin/components/articles.js"></script>
    <script src="/admin/components/hebrew-site.js"></script>
    <script src="/admin/components/automation.js"></script>
    <script src="/admin/components/videoLogs.js"></script>
    <script src="/admin/components/ai-tools.js"></script>
    <script src="/admin/components/design-systems.js"></script>
    <script src="/admin/components/comparisons.js"></script>
    <script src="/admin/components/top10.js"></script>
    <script src="/admin/components/howto.js"></script>
    <script src="/admin/components/bulk.js"></script>
    <script src="/admin/components/mediaUploader.js"></script>
    <script src="/admin/components/subscribers.js"></script>
    <script src="/admin/components/settings.js"></script>
    <script src="/admin/components/sidebar.js"></script>

    <script>
        // Check if user is authenticated and has admin privileges
        auth.onAuthStateChanged(function(user) {
            if (user) {
                const emailEl = document.getElementById('user-email');
                if (emailEl) emailEl.textContent = user.email;

                user.getIdTokenResult().then((idTokenResult) => {
                    if (idTokenResult.claims.admin || user.email === 'meirho01@gmail.com') {
                        console.log("Admin user confirmed. Initializing dashboard...");
                        initializeAdminDashboard();
                    } else {
                        console.warn('User is not an admin. Redirecting.');
                        alert('You do not have administrative privileges.');
                        auth.signOut();
                        window.location.href = '/admin/admin.html';
                    }
                }).catch(error => {
                     console.error("Error getting ID token result:", error);
                     initializeAdminDashboard(); // Graceful fallback
                });
            } else {
                console.log("No user signed in. Redirecting to login.");
                window.location.href = '/admin/admin.html';
            }
        });

        // Logout functionality
        const logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function() {
                auth.signOut().then(() => {
                    window.location.href = '/admin/admin.html';
                }).catch((error) => {
                    console.error('Error signing out:', error);
                    alert('Error signing out. Please try again.');
                });
            });
        }

        // Initialize admin dashboard components
        function initializeAdminDashboard() {
            if (typeof initSidebar === 'function') {
                initSidebar();
                // Check hash in URL or default to articles
                const hash = window.location.hash.replace('#', '');
                if (hash === 'automation') {
                    if (typeof loadAutomationPanel === 'function') loadAutomationPanel();
                } else if (hash === 'video-logs') {
                    if (typeof loadVideoLogs === 'function') loadVideoLogs();
                } else if (hash === 'hebrew-site') {
                    if (typeof loadHebrewSitePanel === 'function') loadHebrewSitePanel();
                } else if (hash === 'ai-tools') {
                    if (typeof loadAiToolsPanel === 'function') loadAiToolsPanel();
                } else if (hash === 'design-systems') {
                    if (typeof loadDesignSystemsPanel === 'function') loadDesignSystemsPanel();
                } else {
                    if (typeof loadArticlesSection === 'function') {
                        loadArticlesSection();
                    }
                }
            } else {
                 console.error("initSidebar function not found!");
                 document.getElementById('content-area').innerHTML = `<div class="alert alert-danger">Error: Cannot initialize the admin sidebar.</div>`;
            }
        }
    </script>
</body>
</html>
