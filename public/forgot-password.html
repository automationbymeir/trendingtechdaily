<!DOCTYPE html>
<html lang="en" dir="ltr" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — TrendingTech Daily</title>
  <meta name="description" content="Reset your TrendingTech Daily account password.">
  <link rel="canonical" href="https://trendingtechdaily.com/forgot-password.html">

  <!-- Google Fonts & Bootstrap Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Master Unified Stylesheets -->
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/css/signup-styles.css">

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>

  <!-- Global Header Placeholder -->
  <div id="navbar-placeholder"></div>

  <main class="signup-page-container">
    <div class="signup-card">
      <div class="signup-header">
        <div class="signup-badge">Security &amp; Recovery</div>
        <h1 class="signup-title">Reset Password</h1>
        <p class="signup-subtitle">Enter your verified email address and we'll send you an encrypted recovery link.</p>
      </div>

      <div id="reset-alert" class="d-none alert mb-3" role="alert"></div>

      <form id="forgot-password-form" class="signup-form">
        <div class="form-group mb-3">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-icon-wrap">
            <i class="bi bi-envelope"></i>
            <input type="email" id="email" class="form-control" placeholder="name@company.com" required autocomplete="email">
          </div>
        </div>

        <button type="submit" class="btn btn-subscribe w-100 py-2 mt-2" id="reset-submit-btn">
          Send Recovery Link
        </button>
      </form>

      <div class="signup-footer mt-4 text-center">
        <p class="text-muted mb-0" style="font-size:0.875rem;">
          Remembered your password? <a href="/login.html" class="text-primary fw-bold">Sign In</a>
        </p>
      </div>
    </div>
  </main>

  <!-- Global Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
  
  <script src="/js/app-base.js"></script>
  <script src="/js/nav-loader.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-password-form');
      const emailInput = document.getElementById('email');
      const submitBtn = document.getElementById('reset-submit-btn');
      const alertBox = document.getElementById('reset-alert');

      if (!form) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        if (!email) return;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span> Sending...';
        alertBox.className = 'd-none alert mb-3';

        try {
          if (typeof auth === 'undefined' && firebase.auth) {
            auth = firebase.auth();
          }
          await auth.sendPasswordResetEmail(email);
          alertBox.className = 'alert alert-success mb-3';
          alertBox.textContent = 'A password reset link has been dispatched to your email. Check your inbox and spam folder.';
          form.reset();
        } catch (error) {
          console.error('Password reset error:', error);
          alertBox.className = 'alert alert-danger mb-3';
          alertBox.textContent = error.message || 'Failed to send password reset email. Please try again.';
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Send Recovery Link';
        }
      });
    });
  </script>
</body>
</html>
