  <style>
    body { font-family: 'Heebo', sans-serif; background: #f7f8fc; }
    .profile-avatar {
      width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 700; color: #fff;
      overflow: hidden; flex-shrink: 0;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .profile-card {
      background: #fff;
      border-radius: 20px;
      border: none;
      box-shadow: 0 2px 20px rgba(0,0,0,0.07);
      padding: 1.75rem;
    }
    .stat-card {
      background: #f3f4f6;
      border-radius: 14px;
      padding: 1rem;
      text-align: center;
    }
    .stat-card .stat-num { font-size: 1.6rem; font-weight: 700; color: #6366f1; }
    .stat-card .stat-label { font-size: 0.8rem; color: #888; margin-top: 0.1rem; }
    .section-title { font-size: 1rem; font-weight: 700; color: #1a1a2e; margin-bottom: 1rem; }
    .btn-primary { border-radius: 10px; font-weight: 600; background: #6366f1; border-color: #6366f1; }
    .btn-primary:hover { background: #4f52d6; border-color: #4f52d6; }
    .btn-outline-danger { border-radius: 10px; font-weight: 500; }
    .form-control { border-radius: 10px; border: 1.5px solid #e5e7eb; }
    .form-control:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
    .article-mini {
      display: flex; gap: 0.75rem; align-items: flex-start;
      padding: 0.75rem 0; border-bottom: 1px solid #f0f0f0;
    }
    .article-mini:last-child { border-bottom: none; }
    .article-mini-img {
      width: 64px; height: 48px; border-radius: 8px;
      object-fit: cover; flex-shrink: 0; background: #e5e7eb;
    }
    .article-mini-title {
      font-size: 0.88rem; font-weight: 600; color: #1a1a2e;
      line-height: 1.4; text-decoration: none;
    }
    .article-mini-title:hover { color: #6366f1; }
    .article-mini-meta { font-size: 0.75rem; color: #aaa; margin-top: 0.2rem; }
    #profile-loading { min-height: 40vh; display: flex; align-items: center; justify-content: center; }
  </style>
  <link rel="stylesheet" href="/css/cookie-consent.css">

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M68CNVMQ"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <div id="he-nav-placeholder"></div>

  <!-- Loading state -->
  <div id="profile-loading" class="text-center py-5">
    <div class="spinner-border text-primary" style="width:2.5rem; height:2.5rem;"></div>
    <p class="mt-3 text-muted">טוען פרופיל...</p>
  </div>

  <!-- Profile content (hidden until loaded) -->
  <main id="profile-content" class="container py-5 d-none" style="max-width:820px;">

    <!-- User Card -->
    <div class="profile-card mb-4">
      <div class="d-flex align-items-center gap-3 mb-4 flex-wrap">
        <div class="profile-avatar" id="profile-avatar-wrap">
          <span id="profile-initials">?</span>
        </div>
        <div class="flex-grow-1">
          <h2 class="mb-0" style="font-size:1.4rem; font-weight:700; color:#1a1a2e;" id="profile-display-name">—</h2>
          <div class="text-muted small" id="profile-email">—</div>
          <div class="text-muted small mt-1" id="profile-member-since"></div>
        </div>
      </div>

      <!-- Stats row -->
      <div class="row g-3 mb-4" id="profile-stats-row">
        <div class="col-4">
          <div class="stat-card">
            <div class="stat-num" id="stat-provider">—</div>
            <div class="stat-label">אמצעי כניסה</div>
          </div>
        </div>
        <div class="col-4">
          <div class="stat-card">
            <div class="stat-num text-success" id="stat-verified">—</div>
            <div class="stat-label">אימות אימייל</div>
          </div>
        </div>
        <div class="col-4">
          <div class="stat-card">
            <div class="stat-num text-info" id="stat-joined">—</div>
            <div class="stat-label">הצטרפות</div>
          </div>
        </div>
      </div>

      <!-- Edit display name -->
      <div>
        <div class="section-title"><i class="bi bi-pencil-square me-2"></i>עריכת פרטים</div>
        <div class="d-flex gap-2 flex-wrap">
          <input type="text" id="edit-display-name" class="form-control" placeholder="שם תצוגה" style="max-width:280px;" />
          <button id="save-display-name-btn" class="btn btn-primary px-4">שמור שם</button>
        </div>
        <div id="edit-name-msg" class="small mt-2" style="min-height:1.2em;"></div>
      </div>
    </div>

    <!-- Recent Articles -->
    <div class="profile-card mb-4">
      <div class="section-title"><i class="bi bi-newspaper me-2"></i>כתבות אחרונות באתר</div>
      <div id="recent-articles-list">
        <div class="text-center py-3 text-muted">
          <div class="spinner-border spinner-border-sm me-2"></div>טוען כתבות...
        </div>
      </div>
      <div class="mt-3 text-center">
        <a href="/he/" class="btn btn-outline-secondary btn-sm rounded-pill px-4">לכל הכתבות</a>
      </div>
    </div>

    <!-- Danger zone -->
    <div class="profile-card">
      <div class="section-title"><i class="bi bi-box-arrow-right me-2"></i>יציאה מהחשבון</div>
      <p class="text-muted small mb-3">לחצו כדי להתנתק מהאתר במכשיר זה.</p>
      <button id="profile-logout-btn" class="btn btn-outline-danger px-4">
        <i class="bi bi-box-arrow-right me-2"></i>התנתקות
      </button>
    </div>
  </main>

  <footer class="py-3 mt-4" style="background:#1a1a2e; color:#888; text-align:center; font-size:0.82rem;">
    <span>© 2025 TrendingTech Daily</span>
    <span class="mx-2">·</span>
    <a href="/he/" class="text-muted text-decoration-none">חזרה לראשי</a>
