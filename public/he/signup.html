<body>

  <!-- Navbar Placeholder -->
  <div id="navbar-placeholder"></div>
  
  <div class="auth-page-container">
    <main class="container">
      <div class="auth-card">
        <h1 class="auth-title">יצירת חשבון חינם</h1>
        <p class="text-center text-muted mb-4" style="font-size:0.875rem;">הצטרפו לקבלת רשימת מעקב אישית, שמירת כתבות וסיכומי AI חכמים.</p>
        
        <form id="signup-form" novalidate>
          <div class="auth-form-group">
            <label for="signup-name">שם מלא</label>
            <input type="text" id="signup-name" class="form-control" placeholder="ישראל ישראלי" required>
          </div>
          <div class="auth-form-group">
            <label for="signup-email">כתובת אימייל</label>
            <input type="email" id="signup-email" class="form-control" placeholder="you@company.com" required>
          </div>
          <div class="auth-form-group">
            <label for="signup-password">סיסמה (לפחות 6 תווים)</label>
            <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required minlength="6">
          </div>
          <button type="submit" class="auth-submit-btn mt-2">הרשם עכשיו</button>
          <div id="signup-error" class="text-danger mt-2 small text-center auth-error-message"></div>
        </form>

        <div class="auth-divider">
          <span>או הרשמו באמצעות</span>
        </div>

        <button id="google-signup-btn" class="auth-social-btn">
          <i class="bi bi-google"></i> המשך באמצעות Google
        </button>

        <div class="auth-alt-links">
          <p>כבר יש לכם חשבון? <a href="/he/login.html">התחברו כאן</a></p>
        </div>
      </div>
    </main>
  </div>
