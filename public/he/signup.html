  <style>
    body { font-family: 'Heebo', sans-serif; background: #f7f8fc; }
    .auth-wrapper { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .auth-card {
      background: #fff;
      border-radius: 20px;
      border: none;
      box-shadow: 0 4px 32px rgba(0,0,0,0.09);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }
    .auth-logo { font-size: 1rem; font-weight: 800; color: #6366f1; letter-spacing: -0.5px; text-decoration: none; }
    .auth-title { font-weight: 700; color: #1a1a2e; font-size: 1.5rem; }
    .auth-sub { color: #888; font-size: 0.9rem; }
    .btn-google {
      background: #fff;
      border: 1.5px solid #ddd;
      color: #333;
      font-weight: 500;
      border-radius: 10px;
      transition: background 0.15s;
    }
    .btn-google:hover { background: #f3f4f6; border-color: #bbb; }
    .or-divider {
      display: flex; align-items: center; gap: 0.75rem;
      color: #aaa; font-size: 0.8rem; margin: 1rem 0;
    }
    .or-divider::before, .or-divider::after {
      content: ''; flex: 1; height: 1px; background: #e5e7eb;
    }
    .form-control { border-radius: 10px; border: 1.5px solid #e5e7eb; padding: 0.65rem 0.9rem; }
    .form-control:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
    .btn-primary { border-radius: 10px; font-weight: 600; background: #6366f1; border-color: #6366f1; }
    .btn-primary:hover { background: #4f52d6; border-color: #4f52d6; }
    .form-label { font-weight: 500; font-size: 0.9rem; color: #374151; margin-bottom: 0.35rem; }
    .benefit-item { display: flex; align-items: center; gap: 0.5rem; color: #4b5563; font-size: 0.9rem; margin-bottom: 0.4rem; }
    .benefit-item i { color: #6366f1; }
  </style>

  <div id="he-nav-placeholder"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <a href="/he/" class="auth-logo d-block mb-3">TrendingTech Daily</a>
        <h2 class="auth-title mb-1">צרו חשבון חינם</h2>
        <p class="auth-sub">הצטרפו לקהילת הטכנולוגיה שלנו</p>
      </div>

      <!-- Benefits -->
      <div class="mb-4 px-1">
        <div class="benefit-item"><i class="bi bi-bookmark-check-fill"></i> שמרו כתבות לקריאה מאוחרת</div>
        <div class="benefit-item"><i class="bi bi-bell-fill"></i> קבלו עדכונים על כתבות חדשות</div>
        <div class="benefit-item"><i class="bi bi-star-fill"></i> גישה לתכנים בלעדיים</div>
      </div>

      <!-- Google Sign Up -->
      <button id="he-google-signup-btn" class="btn btn-google w-100 py-2 mb-3 d-flex align-items-center justify-content-center gap-2">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google" />
        הרשמה עם Google
      </button>

      <div class="or-divider">או</div>

      <!-- Email/Password Form -->
      <form id="he-signup-form" novalidate>
        <div class="mb-3">
          <label for="he-signup-name" class="form-label">שם תצוגה</label>
          <input type="text" id="he-signup-name" class="form-control" placeholder="השם שיופיע לאחרים" required />
        </div>
        <div class="mb-3">
          <label for="he-signup-email" class="form-label">כתובת אימייל</label>
          <input type="email" id="he-signup-email" class="form-control" placeholder="name@example.com" required />
        </div>
        <div class="mb-3">
          <label for="he-signup-password" class="form-label">סיסמה <small class="text-muted">(לפחות 6 תווים)</small></label>
          <input type="password" id="he-signup-password" class="form-control" placeholder="בחרו סיסמה חזקה" required minlength="6" />
        </div>
        <div id="he-signup-error" class="text-danger small mb-2 text-center" style="min-height:1.2em;"></div>
        <button type="submit" id="he-signup-submit" class="btn btn-primary w-100 py-2">הרשמה</button>
      </form>

      <p class="text-center small mt-4 mb-0" style="color:#555;">
        כבר יש לכם חשבון?
        <a href="/he/login" class="fw-600 text-decoration-none" style="color:#6366f1;">כניסה</a>
      </p>
