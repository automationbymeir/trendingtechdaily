<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171A23" />
      <stop offset="100%" stop-color="#090A0E" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#E63946" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#E63946" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="#1E2330" stroke-width="2" />
  
  <!-- Outer Accent Ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.9" />

  <!-- Inner Dark Hub -->
  <circle cx="60" cy="60" r="46" fill="#0D0E15" />

  <!-- Logo Graphics: Stylized TT Daily Tech Glyph -->
  <!-- Top Crimson Header Bar -->
  <rect x="34" y="32" width="52" height="10" rx="5" fill="#E63946" filter="url(#glow)" />
  
  <!-- Primary White Vertical Stem -->
  <rect x="52" y="38" width="16" height="46" rx="4" fill="#FFFFFF" />

  <!-- Secondary T Bar Accent (Subtle tech overlay) -->
  <rect x="42" y="52" width="36" height="7" rx="3.5" fill="#F8FAFC" opacity="0.95" />

  <!-- Pulsing Glowing Dot -->
  <circle cx="82" cy="78" r="5.5" fill="#E63946" filter="url(#glow)" />
</svg>
