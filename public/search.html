<!DOCTYPE html>
<html lang="en" dir="ltr" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Results — TrendingTech Daily</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Master Unified Stylesheet -->
  <link rel="stylesheet" href="/styles.css">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8142734137865758" crossorigin="anonymous"></script>
</head>
<body>
  <!-- Navbar Placeholder -->
  <div id="navbar-placeholder"></div>

  <!-- Main Container -->
  <div class="container my-4 my-md-5">
    
    <!-- Search Box Header -->
    <div style="background:var(--bg-surface); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:2rem; margin-bottom:2rem; box-shadow:var(--shadow-sm);">
      <h1 class="hero-main-title" style="font-size:clamp(1.75rem, 3.5vw, 2.5rem); margin-bottom:1rem;">
        Search Tech Intelligence
      </h1>
      
      <form action="/search.html" method="GET" id="searchPageForm">
        <div style="display:flex; max-width:650px;">
          <input type="search" 
                 id="searchInput" 
                 name="q" 
                 class="form-control" 
                 placeholder="Search articles, models, chips, and tools..." 
                 autocomplete="off"
                 style="border-start-end-radius:0; border-end-end-radius:0;"
                 required>
          <button type="submit" class="btn btn-subscribe" style="border-start-start-radius:0; border-end-start-radius:0;">
            <i class="bi bi-search me-1"></i> Search
          </button>
        </div>
      </form>
      
      <div id="searchMeta" class="text-muted mt-3" style="display: none; font-size:0.9rem;">
        Found <strong id="resultCount" style="color:var(--text-main);">0</strong> results for "<strong id="searchQueryDisplay" style="color:var(--accent-red);"></strong>"
      </div>
    </div>

    <!-- Main Content Grid -->
    <div class="row d-flex flex-column flex-lg-row gap-4">
      
      <!-- Results Column (Left 68%) -->
      <main class="flex-grow-1" style="max-width: 860px;">
        
        <!-- AI Summary Card -->
        <div id="aiSummarySection" class="ai-summary-card" style="display: none;">
          <div class="ai-summary-header">
            <i class="bi bi-stars"></i> AI Synthesis Summary
          </div>
          <p id="aiSummaryContent" style="color:var(--text-main); margin-bottom:0;"></p>
        </div>

        <!-- Search Results Stream -->
        <div id="searchResults">
          <div class="text-center py-5">
            <i class="bi bi-search" style="font-size: 3rem; color: var(--text-faint);"></i>
            <h3 class="mt-3" style="font-size:1.25rem; font-weight:700;">Start Your Search</h3>
            <p class="text-muted" style="font-size:0.9rem;">Enter a keyword or topic above to discover articles and intelligence briefings.</p>
          </div>
        </div>
      </main>

      <!-- Sidebar Column (Right 32%) -->
      <aside style="width: 100%; max-width: 380px;">
        
        <!-- Filters Card -->
        <div class="card mb-4">
          <div class="card-body">
            <h4 class="card-title mb-3" style="font-size:1rem;">Refine Search</h4>
            <div class="mb-3">
              <label class="form-label text-muted small fw-bold">Topic Category</label>
              <select class="form-select" id="categoryFilter">
                <option value="">All Categories</option>
              </select>
            </div>
            <div>
              <label class="form-label text-muted small fw-bold">Sort By</label>
              <select class="form-select" id="sortFilter">
                <option value="relevance">Relevance</option>
                <option value="date">Date (Newest)</option>
                <option value="views">Most Viewed</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Trending Topics Card -->
        <div class="card mb-4">
          <div class="card-body">
            <h4 class="card-title mb-3" style="font-size:1rem;">Trending Topics</h4>
            <ul id="trendingTopicsList" class="d-flex flex-column gap-2">
              <li class="text-muted small">Loading topics...</li>
            </ul>
          </div>
        </div>

      </aside>
    </div>
  </div>

  <!-- Persistent Audio Dock -->
  <div class="podcast-dock" role="region" aria-label="Audio Player">
    <div class="container dock-inner">
      <div class="dock-track-info">
        <div class="dock-art"><i class="bi bi-mic-fill"></i></div>
        <div class="dock-meta">
          <div class="dock-title">TrendingTech Daily Audio Feed</div>
          <div class="dock-sub">Daily Silicon Valley Tech Review</div>
        </div>
      </div>
      <div class="dock-controls">
        <div class="dock-progress"><div class="dock-progress-bar"></div></div>
        <button class="dock-play-btn" aria-label="Play audio"><i class="bi bi-play-fill"></i></button>
      </div>
    </div>
  </div>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <script src="/js/config.js?v=20260819_3"></script>
  <script src="/js/auth.js?v=20260819_3"></script>
  <script src="/js/nav-loader.js?v=20260819_3"></script>
  <script src="/js/app-base.js?v=20260819_3"></script>
  <script src="/js/search.js?v=20260819_3"></script>
</body>
</html>
