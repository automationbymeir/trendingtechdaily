    <style>
        body {
            font-family: 'Heebo', sans-serif;
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;

        .container-box {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 100%;
            text-align: center;
            overflow: hidden;
        }
        .cover-photo-container {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #111111 0%, #333333 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 3px solid #2196F3;
            position: relative;
        }
        .cover-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            background: white;
            position: absolute;
            bottom: -40px;
        }
        .content-area {
            padding: 60px 30px 40px; /* Extra top padding to clear the overlapping logo */
        }
        .btn-primary {
            background-color: #2196F3;
            border: none;

            font-weight: 600;
            margin-top: 20px;
        }
        .btn-primary:hover {
            background-color: #1976D2;
        }
        .loader {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(33, 150, 243, 0.3);
            border-radius: 50%;
            border-top-color: #2196F3;
            animation: spin 1s ease-in-out infinite;
            margin-top: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status-message {
            font-size: 1.1rem;
            margin-top: 20px;
        }
        .success-icon {
            color: #4CAF50;
            font-size: 40px;
            margin-bottom: 10px;
            display: none;
        }

            color: #F44336;
            font-size: 40px;
            margin-bottom: 10px;
            display: none;
        }

<body>

    <div class="container-box">
        <div class="cover-photo-container">
            <img src="/img/newsletter-logo.jpg" alt="TrendingTech Daily" class="cover-logo" id="logo-img" onerror="this.src='/img/logo.png'">
        </div>
        
        <div class="content-area">
            <h2 class="mb-3">הסרה מרשימת התפוצה</h2>
            
            <div id="loading" class="loader"></div>
            
            <div id="success-state" style="display: none;">
                <div class="success-icon">✓</div>
                <p class="status-message">הוסרתם בהצלחה מרשימת התפוצה שלנו.</p>
                <p class="text-muted" style="font-size: 0.9rem;">לא תקבלו מאיתנו יותר עדכונים שבועיים למייל זה.</p>
                <a href="/he/" class="btn btn-primary">חזרה לעמוד הבית</a>
            </div>

            <div id="error-state" style="display: none;">
                <div class="error-icon">✗</div>
                <p class="status-message text-danger" id="error-text">אירעה שגיאה. נסה שוב מאוחר יותר.</p>
                <a href="/he/" class="btn btn-primary">חזרה לעמוד הבית</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email');
            
            const loading = document.getElementById('loading');
            const successState = document.getElementById('success-state');
            const errorState = document.getElementById('error-state');
            const errorText = document.getElementById('error-text');

            if (!email) {
                loading.style.display = 'none';
                errorState.style.display = 'block';
                errorText.innerText = 'כתובת אימייל חסרה. לא ניתן לבצע הסרה.';
                return;
            }

            // Call the Cloud Function directly
            fetch(`https://unsubscribenewsletter-xa54maubsa-uc.a.run.app/?email=${encodeURIComponent(email)}`, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                loading.style.display = 'none';
                if (data.success) {
                    successState.style.display = 'block';
                } else {
                    errorState.style.display = 'block';
                    errorText.innerText = data.error || 'אירעה שגיאה בעת ההסרה.';
                }
            })
            .catch(err => {
                loading.style.display = 'none';
                errorState.style.display = 'block';
                console.error("Unsubscribe error:", err);
            });
        });
    </script>
